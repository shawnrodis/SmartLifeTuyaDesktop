[package]
name = "smartlife-tuya-desktop"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "SmartLife & Tuya Desktop - a clean dashboard for Smart Life / Tuya devices (Windows edition)"

[[bin]]
name = "SmartLifeTuyaDesktop"
path = "src/main.rs"

[dependencies]
eframe = "0.27"
egui = "0.27"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3

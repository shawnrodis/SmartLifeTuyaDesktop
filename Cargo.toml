[package]
name = "smartlife-tuya-desktop"
version = "1.6.3"
edition = "2021"
license = "GPL-3.0-only"
description = "SmartLife & Tuya Desktop - a clean dashboard for Smart Life / Tuya devices (native desktop editions: Windows & macOS)"

[[bin]]
name = "SmartLifeTuyaDesktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", features = ["wgpu"] }
egui = "0.37"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HomeKit (HAP) thermostat control — pure-Rust, cross-platform pieces
# only (no OS-specific or Apple-specific dependency). The HAP controller
# itself is hand-written in src/hap.rs from the protocol description;
# these crates supply only primitives (hashing, KDF, curves, ciphers,
# big integers, randomness, mDNS).
mdns-sd = "0.15"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
x25519-dalek = "2"
sha2 = "0.10"
hkdf = "0.12"
num-bigint = "0.4"
rand = "0.8"

# System-tray / menu-bar icon + menu for the startup/tray
# behaviour. Windows since v1.2.1, macOS since v1.4.0 — the
# dependency follows the feature (on Linux it would drag in GTK
# system libraries for nothing). Windows transitive deps are muda
# + windows-sys bindings only; macOS uses objc2/AppKit bindings.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.19"

# flock-style file locking for the macOS single-instance guard
# (v1.4.0; Windows uses a named mutex instead). Unix-only, tiny.
[target.'cfg(unix)'.dependencies]
fs2 = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
# HWND extraction (eframe already pulls this crate in; naming it
# makes the type usable) and the Shell_NotifyIcon bindings for the
# one-time tray balloon (same windows-sys muda already brings in).
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3

[patch.crates-io]
# Vendored winit 0.30.13 + the Win11 WM_DPICHANGED suggested-rect fix
# (upstream winit#4341, not yet in a 0.30.x release). See
# vendor/winit/TUYA-PATCH-README.md. Drop when upstream ships it.
winit = { path = "vendor/winit" }

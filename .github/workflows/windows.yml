name: Build Windows

# Builds the native egui app (the product since the Flutter and C++
# ports were parked) and the per-user NSIS installer. The previous
# version of this file built the parked Flutter app; it built the
# wrong program, so it was replaced, not repaired.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      # build.rs embeds the exe icon/manifest with windres, and the
      # GNU target links with mingw gcc — both come from MinGW.
      - name: Install MinGW (windres + GNU linker)
        run: |
          choco install mingw -y
          $windres = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\windres.exe"
          if (-not (Test-Path $windres)) { throw "windres not found after mingw install" }
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH
      - name: Build the egui app (Windows, GNU target)
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Build NSIS installer
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y }
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          Copy-Item -Force target/x86_64-pc-windows-gnu/release/SmartLifeTuyaDesktop.exe installer/
          cd installer
          makensis installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: smartlife-tuya-windows
          path: |
            installer/SmartLifeTuyaDesktop-Setup-*.exe

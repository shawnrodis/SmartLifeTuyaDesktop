name: Build Windows

# Builds the native egui app (the product since the Flutter and C++
# ports were parked) and the per-user NSIS installer. The previous
# version of this file built the parked Flutter app; it built the
# wrong program, so it was replaced, not repaired.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      # build.rs embeds the exe icon/manifest with windres, and the
      # GNU target links with mingw gcc — both come from MinGW.
      - name: Install MinGW (windres + GNU linker)
        run: |
          choco install mingw -y
          # The chocolatey mingw package's install dir varies by
          # version (16.1.0 lands under C:\ProgramData\mingw64),
          # so locate windres instead of assuming a path — a
          # hardcoded path failed the first run.
          $windres = Get-ChildItem -Path C:\ProgramData\mingw64 -Recurse -Filter windres.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $windres) { throw "windres not found after mingw install" }
          $windres.Directory.FullName >> $env:GITHUB_PATH
      - name: Build the egui app (Windows, GNU target)
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Build NSIS installer
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y }
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          # Clear any stale setup exe first: installer/ carries a
          # tracked v1.4.0 setup, and the artifact glob below would
          # otherwise sweep it up alongside the fresh build.
          Remove-Item installer/Homestead-Setup-*.exe -ErrorAction SilentlyContinue
          Copy-Item -Force target/x86_64-pc-windows-gnu/release/Homestead.exe installer/
          cd installer
          makensis installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: homestead-windows
          path: |
            installer/Homestead-Setup-*.exe

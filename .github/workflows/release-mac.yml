# SmartLife & Tuya Desktop — macOS DMG builder.
#
# STAGED FILE (see MAC_BUILD.md next to it): this workflow is not
# in the repo yet because pushing workflow files needs the
# `workflow` token scope. When that lands, copy this file to
# .github/workflows/release-mac.yml in the repo — unchanged.
#
# Trigger: every published GitHub release (plus manual dispatch
# against an existing tag). It builds the app for both Apple
# architectures on a real Mac runner, lipos them into ONE
# universal binary, assembles SmartLifeTuyaDesktop.app with the
# pinned per-arch ffmpeg builds in Contents/Resources, ad-hoc
# codesigns it (the build is deliberately unsigned), wraps it in
# SmartLifeTuyaDesktop-v<version>.dmg and uploads the DMG to the
# same release the Windows installer and web file live on.

name: macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v1.4.0)"
        required: true
        type: string

permissions:
  contents: write # gh release upload

env:
  CARGO_TERM_COLOR: always

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - name: Resolve the release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "Building macOS DMG for release $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - name: Install the Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Run the test suite (host target)
        run: cargo test

      - name: Build — Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build — Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Lipo into one universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/SmartLifeTuyaDesktop \
            target/x86_64-apple-darwin/release/SmartLifeTuyaDesktop \
            -output dist/SmartLifeTuyaDesktop
          # Prove both slices are really in there.
          lipo -info dist/SmartLifeTuyaDesktop

      # Pinned static ffmpeg builds (see MAC_BUILD.md for the
      # source, the hashes and the version caveat). The app's
      # camera tiles look for exactly these names in
      # Contents/Resources, picked by std::env::consts::ARCH.
      - name: Fetch the pinned static ffmpeg builds
        run: |
          mkdir -p dist/ffmpeg
          BASE=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          curl -fL --retry 3 -o dist/ffmpeg/ffmpeg-arm64  "$BASE/ffmpeg-darwin-arm64"
          curl -fL --retry 3 -o dist/ffmpeg/ffmpeg-x86_64 "$BASE/ffmpeg-darwin-x64"
          echo "a90e3db6a3fd35f6074b013f948b1aa45b31c6375489d39e572bea3f18336584  dist/ffmpeg/ffmpeg-arm64" | shasum -a 256 -c -
          echo "ebdddc936f61e14049a2d4b549a412b8a40deeff6540e58a9f2a2da9e6b18894  dist/ffmpeg/ffmpeg-x86_64" | shasum -a 256 -c -
          chmod +x dist/ffmpeg/ffmpeg-arm64 dist/ffmpeg/ffmpeg-x86_64
          file dist/ffmpeg/ffmpeg-arm64 dist/ffmpeg/ffmpeg-x86_64

      - name: Assemble SmartLifeTuyaDesktop.app
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          APP="dist/SmartLifeTuyaDesktop.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/SmartLifeTuyaDesktop "$APP/Contents/MacOS/SmartLifeTuyaDesktop"
          chmod +x "$APP/Contents/MacOS/SmartLifeTuyaDesktop"
          cp dist/ffmpeg/ffmpeg-arm64 dist/ffmpeg/ffmpeg-x86_64 "$APP/Contents/Resources/"

          # AppIcon.icns from the repo's assets/icon.png.
          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16     assets/icon.png --out "$ICONSET/icon_16x16.png"      >/dev/null
          sips -z 32 32     assets/icon.png --out "$ICONSET/icon_16x16@2x.png"   >/dev/null
          sips -z 32 32     assets/icon.png --out "$ICONSET/icon_32x32.png"      >/dev/null
          sips -z 64 64     assets/icon.png --out "$ICONSET/icon_32x32@2x.png"   >/dev/null
          sips -z 128 128   assets/icon.png --out "$ICONSET/icon_128x128.png"    >/dev/null
          sips -z 256 256   assets/icon.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   assets/icon.png --out "$ICONSET/icon_256x256.png"    >/dev/null
          sips -z 512 512   assets/icon.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   assets/icon.png --out "$ICONSET/icon_512x512.png"    >/dev/null
          sips -z 1024 1024 assets/icon.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>SmartLifeTuyaDesktop</string>
            <key>CFBundleDisplayName</key>
            <string>SmartLife &amp; Tuya Desktop</string>
            <key>CFBundleIdentifier</key>
            <string>com.shawnrodis.smartlifetuya</string>
            <key>CFBundleExecutable</key>
            <string>SmartLifeTuyaDesktop</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          find "$APP" -type f | sort

      - name: Ad-hoc codesign (deliberately unsigned)
        run: |
          codesign --force --deep --sign - dist/SmartLifeTuyaDesktop.app
          codesign --verify --verbose=2 dist/SmartLifeTuyaDesktop.app

      - name: Build the DMG
        id: dmg
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          DMG="SmartLifeTuyaDesktop-v${VERSION}.dmg"
          rm -rf dmgroot
          mkdir dmgroot
          cp -R dist/SmartLifeTuyaDesktop.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "SmartLife & Tuya Desktop" \
            -srcfolder dmgroot -ov -format UDZO "$DMG"
          ls -la "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Upload the DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.rel.outputs.tag }}" "${{ steps.dmg.outputs.dmg }}" --clobber
